# ============================================================
# environment.yml
# Conda environment for Explainable Anomaly Detection project
# ============================================================
# Create:  conda env create -f environment.yml
# Activate: conda activate anomaly-xai
# Update:  conda env update -f environment.yml --prune

name: anomaly-xai
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.13
  - tqdm>=4.65
  - requests>=2.31
  # PyTorch (CPU) — change to pytorch-cuda=11.8 for GPU
  - pytorch>=2.0
  - torchvision>=0.15
  - cpuonly
  - pip:
    - shap>=0.44
